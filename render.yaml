services:
  - type: web
    name: chessbook-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard → Neon connection string
      - key: JWT_SECRET
        generateValue: true  # Render generates a random secret
      - key: CORS_ORIGINS
        value: "https://chessbook-frontend.onrender.com"

  - type: web
    name: chessbook-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://chessbook-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
